services:
  mongo:
    image: mongo:7
    container_name: taskflow-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - taskflow-net

  backend:
    build: ./backend
    container_name: taskflow-backend
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - FRONTEND_URL=http://localhost:5173
      - MONGO_URI=mongodb://mongo:27017/taskflow
    depends_on:
      - mongo
    networks:
      - taskflow-net

  frontend:
    build: ./frontend
    container_name: taskflow-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:3000
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    networks:
      - taskflow-net

volumes:
  mongo-data:

networks:
  taskflow-net:
    driver: bridge
